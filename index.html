<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Physics Simulator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="canvas-container"></div>
    <div class="control-panel" id="controlPanel">
        <div class="panel-header">
            <h3>Physics Controls</h3>
            <button class="panel-toggle" id="panelToggle">Collapse</button>
        </div>
        <div class="panel-content" id="panelContent">
            <div class="panel-section">
                <div class="section-title">World Physics</div>
                <div class="control-group">
                    <div class="control-label"><span>Gravity Y (m/s²)</span><span class="control-value" id="gravityValue">-9.82</span></div>
                    <input type="range" id="gravitySlider" min="-20" max="0" step="0.1" value="-9.82">
                </div>
                <div class="control-group">
                    <div class="control-label"><span>Gravity X (m/s²)</span><span class="control-value" id="gravityXValue">0.00</span></div>
                    <input type="range" id="gravityXSlider" min="-10" max="10" step="0.1" value="0">
                </div>
                <div class="control-group">
                    <div class="control-label"><span>Gravity Z (m/s²)</span><span class="control-value" id="gravityZValue">0.00</span></div>
                    <input type="range" id="gravityZSlider" min="-10" max="10" step="0.1" value="0">
                </div>
                <div class="control-group">
                    <div class="control-label"><span>Air Resistance</span><span class="control-value" id="airResistanceValue">0.01</span></div>
                    <input type="range" id="airResistanceSlider" min="0" max="0.5" step="0.01" value="0.01">
                </div>
                <div class="control-group">
                    <div class="control-label"><span>Solver Iterations</span><span class="control-value" id="iterationsValue">10</span></div>
                    <input type="range" id="iterationsSlider" min="4" max="30" step="1" value="10">
                </div>
                <div class="control-group">
                    <div class="control-label"><span>Time Scale</span><span class="control-value" id="timeScaleValue">1.0</span></div>
                    <input type="range" id="timeScaleSlider" min="0" max="3" step="0.1" value="1">
                </div>
            </div>
            <div class="panel-section">
                <div class="section-title">Spawn Defaults</div>
                <div class="control-group">
                    <div class="control-label"><span>Default Mass</span><span class="control-value" id="massValue">2.5</span></div>
                    <input type="range" id="massSlider" min="0.5" max="10" step="0.1" value="2.5">
                </div>
                <div class="control-group">
                    <div class="control-label"><span>Default Size</span><span class="control-value" id="sizeValue">1.0</span></div>
                    <input type="range" id="sizeSlider" min="0.3" max="2.5" step="0.1" value="1.0">
                </div>
                <div class="control-group">
                    <div class="control-label"><span>Bounciness (Restitution)</span><span class="control-value" id="restitutionValue">0.30</span></div>
                    <input type="range" id="restitutionSlider" min="0" max="1" step="0.05" value="0.3">
                </div>
                <div class="control-group">
                    <div class="control-label"><span>Friction</span><span class="control-value" id="frictionValue">0.30</span></div>
                    <input type="range" id="frictionSlider" min="0" max="1" step="0.05" value="0.3">
                </div>
                <div class="control-group">
                    <div class="control-label">Shape</div>
                    <select id="shapeSelect">
                        <option value="random">Random (Box/Sphere)</option>
                        <option value="box">Box</option>
                        <option value="sphere">Sphere</option
                    </select>
                </div>
            </div>
            <div class="panel-section">
                <div class="section-title">Actions</div>
                <div class="btn-group">
                    <button class="btn primary" id="spawnBtn">Spawn Object</button>
                    <button class="btn" id="clearBtn">Clear All</button>
                </div>
                <div class="btn-group" style="margin-top: 8px;">
                    <button class="btn danger" id="resetBtn">Reset Scene</button>
                    <button class="btn" id="pauseBtn">Pause</button>
                </div>
            </div>
            <div class="panel-section">
                <div class="section-title">Live Stats</div>
                <div style="font-family: 'Monaco', 'Menlo', monospace; font-size: 12px; color: #666;" id="liveStats">
                    Dynamic bodies: 0<br>
                    Static bodies: 1<br>
                    Contacts: 0<br>
                    Time scale: 1.0x
                </div>
            </div>
        </div>
    </div>
    <div class="info-panel">
        <h3>3D Physics Simulator</h3>
    </div>
    <div class="stats" id="stats">FPS: --<br>Bodies: 0</div>
    <div class="spawn-hint">Click to spawn • Space=spawn • R=reset • C=clear • P=pause</div>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
            "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
        }
    }
    </script>
    <script type="module" src="script.js"></script>
</body>
</html>
